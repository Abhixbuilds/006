services:
  - type: web
    name: dsa-log-fullstack
    env: node
    rootDir: project5
    buildCommand: "cd server && npm install"
    startCommand: "cd server && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/dsa-log.db
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
